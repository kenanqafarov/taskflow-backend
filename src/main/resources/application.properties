spring.application.name=taskflow-backend
server.port=${PORT:8080}
spring.config.import=optional:file:.env.properties

# MySQL datasource. Environment variables can override every value in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flowbuddy?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
taskflow.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
taskflow.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}

# CORS
taskflow.cors.origins=${CORS_ORIGINS:*}

# Chat uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
taskflow.upload.dir=${UPLOAD_DIR:uploads}

# Gemini assistant
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# LiveKit (leave blank if not configured; /api/meet/* will return 503)
livekit.url=${LIVEKIT_URL:}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}

# Seed super admin
taskflow.seed.super-admin.username=super_admin
taskflow.seed.super-admin.password=super1234!
